{% extends "base.html" %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .signup-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .signup-card {
        width: 100%;
        max-width: 440px;
        border: none;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .signup-card .card-header {
        background: #222;
        color: white;
        border-radius: 16px 16px 0 0;
        padding: 28px 32px 20px;
        text-align: center;
    }
    .signup-card .card-header h4 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
    }
    .signup-card .card-header p {
        margin: 6px 0 0;
        font-size: 14px;
        opacity: 0.7;
    }
    .signup-card .card-body { padding: 32px; }
    .form-label { font-weight: 500; font-size: 14px; color: #444; }
    .form-control {
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 15px;
        border: 1.5px solid #ddd;
    }
    .form-control:focus {
        border-color: #4CAF50;
        box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
    }
    .btn-signup {
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-size: 16px;
        font-weight: 600;
        width: 100%;
        transition: background 0.2s;
    }
    .btn-signup:hover { background: #388E3C; color: white; }
    .divider {
        text-align: center;
        color: #aaa;
        font-size: 13px;
        margin: 18px 0;
        position: relative;
    }
    .divider::before, .divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background: #e0e0e0;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .btn-login {
        border: 2px solid #222;
        color: #222;
        background: white;
        border-radius: 8px;
        padding: 10px;
        font-size: 15px;
        font-weight: 500;
        width: 100%;
        transition: all 0.2s;
        text-decoration: none;
        display: block;
        text-align: center;
    }
    .btn-login:hover { background: #222; color: white; }
    .form-text { font-size: 12px; color: #999; }
</style>

<div class="signup-wrapper">
    <div class="signup-card card">
        <div class="card-header">
            <h4>🛒 Merkafacil</h4>
            <p>Crea tu cuenta gratis</p>
        </div>
        <div class="card-body">

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" style="border-radius:8px; font-size:14px;">
                <span>⚠️</span> {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Elige un nombre de usuario" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="tucorreo@ejemplo.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
                    <div class="form-text">Usa letras, números y símbolos para mayor seguridad.</div>
                </div>
                <button type="submit" class="btn-signup">Crear cuenta</button>
            </form>

            <div class="divider">¿Ya tienes cuenta?</div>
            <a href="{% url 'login' %}" class="btn-login">Iniciar sesión</a>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}

<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Merkafacil</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #222;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .navbar a {
            text-decoration: none;
        }

        .navbar button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #4CAF50;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .navbar button:hover {
            background: #43a047;
        }

        .navbar .user {
            color: white;
            margin-left: auto;
            margin-right: 10px;
        }

        .content {
            padding: 40px;
        }

        /* ── Carrito badge ── */
        .carrito-btn {
            position: relative;
            display: inline-block;
            margin-left: auto;   /* empuja el carrito hacia la derecha */
        }

        .carrito-btn button {
            background: #FB8C00;  /* naranja para distinguirlo del resto */
        }

        .carrito-btn button:hover {
            background: #E65100;
        }

        .carrito-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e53935;
            color: white;
            border-radius: 50%;
            font-size: 11px;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: none;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <a href="/">
            <button>Inicio</button>
        </a>

        <a href="{% url 'catalogo' %}">
            <button>Productos</button>
        </a>

        <a href="{% url 'about' %}">
            <button>Acerca de nosotros</button>
        </a>

        <!-- Botón carrito con contador -->
        <a href="{% url 'carrito' %}" class="carrito-btn">
            <button>🛒 Carrito</button>
            {% if contador_carrito > 0 %}
                <span class="carrito-badge">{{ contador_carrito }}</span>
            {% endif %}
        </a>

        {% if user.is_authenticated %}

            <span class="user">
                Hola {{ user.username }}
            </span>

            <a href="{% url 'mis_pedidos' %}">
                <button>📋 Mis pedidos</button>
            </a>

            <a href="{% url 'logout' %}">
                <button>Cerrar sesión</button>
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                <button>Iniciar sesión</button>
            </a>

            <a href="{% url 'signup' %}">
                <button>Registrarse</button>
            </a>

        {% endif %}

    </div>


    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>

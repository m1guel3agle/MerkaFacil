<div id="product-modal-overlay"
     onclick="closeModal()"
     style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:1000; align-items:center; justify-content:center;">

    <div id="product-modal"
         onclick="event.stopPropagation()"
         style="background:white; border-radius:18px; max-width:480px; width:92%; max-height:90vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,0.25); position:relative; animation:fadeInUp 0.28s ease;">

        <button onclick="closeModal()"
                style="position:absolute; top:12px; right:16px; background:none; border:none; font-size:22px; cursor:pointer; color:#666; z-index:10; line-height:1;">✕</button>

        <div style="width:100%; height:220px; overflow:hidden; border-radius:18px 18px 0 0; background:#eee; display:flex; align-items:center; justify-content:center;">
            <img id="modal-img" src="" alt="" style="width:100%; height:100%; object-fit:cover; display:none;">
            <div id="modal-placeholder" style="font-size:72px; display:none;">🛒</div>
        </div>

        <div style="padding:22px 24px 24px;">
            <h2 id="modal-name" style="font-family:'Fredoka One',cursive; color:var(--verde-principal); margin:0 0 8px; font-size:24px;"></h2>
            <div id="modal-price" style="font-family:'Fredoka One',cursive; font-size:26px; color:var(--verde-principal); margin-bottom:8px;"></div>
            <div id="modal-stock" style="font-size:14px; font-weight:600; margin-bottom:12px;"></div>
            <div id="modal-desc-wrap" style="background:#f9fbe7; border-left:4px solid var(--verde-principal); border-radius:4px; padding:10px 14px; margin-bottom:18px; display:none;">
                <p id="modal-desc" style="margin:0; font-size:14px; color:#444; line-height:1.5;"></p>
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <a id="modal-cart-btn" href="#"
                   style="display:block; padding:9px 0; border:none; border-radius:8px; background:var(--verde-principal); color:white; font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; cursor:pointer; text-align:center; text-decoration:none; transition:background 0.2s;">
                    🛒 Agregar al carrito
                </a>
                {% if user.is_authenticated %}
                    <button id="modal-fav-btn"
                            onclick="toggleFavoriteModal()"
                            style="width:100%; padding:9px 0; border-radius:8px; font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; cursor:pointer; transition:all 0.2s; background:white; color:#e53935; border:2px solid #e53935;">
                        Agregar a favoritos
                    </button>
                {% else %}
                    <a href="/login/"
                       style="display:block; padding:9px 0; border-radius:8px; font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; text-align:center; background:white; color:#e53935; border:2px solid #e53935; text-decoration:none; box-sizing:border-box;">
                        Agregar a favoritos
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<style>
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>

<script>
let currentProductId = null;
let currentIsFavorite = false;

function openModal(name, imageUrl, price, stock, description, productId, isFavorite) {
    currentProductId = productId;
    currentIsFavorite = isFavorite;

    document.getElementById('modal-name').textContent = name;
    document.getElementById('modal-price').textContent = '$ ' + price.toLocaleString('es-CO');

    const stockEl = document.getElementById('modal-stock');
    if (stock > 0) {
        stockEl.textContent = '✔ Disponible';
        stockEl.style.color = '#43a047';
    } else {
        stockEl.textContent = '✖ Sin stock';
        stockEl.style.color = '#e53935';
    }

    const img = document.getElementById('modal-img');
    const placeholder = document.getElementById('modal-placeholder');
    if (imageUrl) {
        img.src = imageUrl;
        img.style.display = 'block';
        placeholder.style.display = 'none';
    } else {
        img.style.display = 'none';
        placeholder.style.display = 'block';
    }

    const descWrap = document.getElementById('modal-desc-wrap');
    if (description && description.trim()) {
        document.getElementById('modal-desc').textContent = description;
        descWrap.style.display = 'block';
    } else {
        descWrap.style.display = 'none';
    }

    const cartBtn = document.getElementById('modal-cart-btn');
    if (stock > 0) {
        cartBtn.href = '/cart/add/' + productId + '/';
        cartBtn.style.background = 'var(--verde-principal)';
        cartBtn.style.pointerEvents = 'auto';
        cartBtn.style.opacity = '1';
    } else {
        cartBtn.href = '#';
        cartBtn.style.background = '#ccc';
        cartBtn.style.pointerEvents = 'none';
        cartBtn.style.opacity = '0.7';
    }

    updateModalFavBtn(isFavorite);

    const overlay = document.getElementById('product-modal-overlay');
    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    const modal = document.getElementById('product-modal');
    modal.style.animation = 'none';
    modal.offsetHeight;
    modal.style.animation = 'fadeInUp 0.28s ease';
}

function closeModal() {
    document.getElementById('product-modal-overlay').style.display = 'none';
    document.body.style.overflow = '';
    currentProductId = null;
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

function updateModalFavBtn(isFav) {
    const btn = document.getElementById('modal-fav-btn');
    if (!btn) return;
    if (isFav) {
        btn.textContent = '❤️ Favorito';
        btn.style.background = '#e53935';
        btn.style.color = 'white';
    } else {
        btn.textContent = 'Agregar a favoritos';
        btn.style.background = 'white';
        btn.style.color = '#e53935';
    }
    currentIsFavorite = isFav;
}

function toggleFavoriteModal() {
    if (!currentProductId) return;
    fetch('/favorites/toggle/' + currentProductId + '/', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCsrfToken(),
            'X-Requested-With': 'XMLHttpRequest',
        },
    })
    .then(r => r.json())
    .then(data => {
        const isFav = data.status === 'added';
        updateModalFavBtn(isFav);
        const cardBtn = document.getElementById('fav-btn-' + currentProductId);
        if (cardBtn) updateCardFavBtn(cardBtn, isFav);
    });
}

function quickToggleFav(productId, btn) {
    fetch('/favorites/toggle/' + productId + '/', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCsrfToken(),
            'X-Requested-With': 'XMLHttpRequest',
        },
    })
    .then(r => r.json())
    .then(data => {
        const isFav = data.status === 'added';
        updateCardFavBtn(btn, isFav);
        if (currentProductId === productId) updateModalFavBtn(isFav);
    });
}

function updateCardFavBtn(btn, isFav) {
    if (isFav) {
        btn.textContent = '❤️ Favorito';
        btn.classList.add('fav-active');
    } else {
        btn.textContent = 'Favoritos';
        btn.classList.remove('fav-active');
    }
}

function getCsrfToken() {
    const name = 'csrftoken';
    for (const c of document.cookie.split(';')) {
        const t = c.trim();
        if (t.startsWith(name + '=')) return decodeURIComponent(t.substring(name.length + 1));
    }
    return '';
}
</script>
